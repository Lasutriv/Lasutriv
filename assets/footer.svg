<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-labelledby="t">
  <title id="t">End of file</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a524" stop-opacity=".045"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#020304"/>
      <rect width="2" height="6" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
    <clipPath id="panel"><rect width="1200" height="72" rx="12"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; white-space: pre; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .band { animation: band 7s linear infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes band { from { transform: translateY(-140px); }
                      to { transform: translateY(420px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#panel)">
  <rect width="1200" height="72" fill="url(#bg)"/>
  <rect width="1200" height="72" fill="url(#grid)"/>
  <rect x="56" y="28" width="120" height="16" fill="url(#hatch)" stroke="#30363d"/><rect x="186" y="28" width="54" height="16" fill="url(#hatch)" stroke="#30363d"/><rect x="250" y="28" width="168" height="16" fill="url(#hatch)" stroke="#30363d"/><rect x="782" y="28" width="168" height="16" fill="url(#hatch)" stroke="#30363d"/><rect x="960" y="28" width="54" height="16" fill="url(#hatch)" stroke="#30363d"/><rect x="1024" y="28" width="120" height="16" fill="url(#hatch)" stroke="#30363d"/>
  <text x="600.0" y="41" font-size="14" letter-spacing="5" fill="#8b949e" text-anchor="middle" textLength="187.6" lengthAdjust="spacing">END OF FILE  <tspan fill="#f5a524" class="blink">▮</tspan></text>
  <rect class="band" width="1200" height="120" fill="url(#band)"/>
  <rect width="1200" height="72" fill="url(#scan)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="71" rx="11.5" fill="none" stroke="#30363d"/>
</svg>
