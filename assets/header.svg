    <clipPath id="type1"><rect x="54" y="275" width="0" height="29"><animate attributeName="width" values="0;11.6;23.2;34.8;46.4;58;69.6;81.2;92.8;104.4;116;127.6;139.2;150.8;162.4;174;185.6;197.2;208.8;220.4;232;243.6;255.2;266.8;278.4;290;301.6;313.2;324.8;336.4;348;359.6;371.2;382.8;394.4;406;417.6;429.2;440.8;452.4;464;475.6;487.2;498.8;510.4;522;533.6;545.2;556.8;568.4;580;591.6;603.2;614.8;626.4;638;649.6;661.2;672.8;684.4" begin="3.02s" dur="1.77s" calcMode="discrete" fill="freeze"/></rect></clipPath>
