<style>
@font-face{font-family:'gf-dm-mono-400-normal';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'gf-inter-400-normal';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'gf-space-grotesk-500-normal';src:url(data:font/woff2;base64,) format('woff2')}
text{white-space:pre}

.b{mix-blend-mode:screen;transform-box:fill-box;transform-origin:center;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.b1{animation-name:g1;animation-duration:31s;animation-delay:-7s}
.b2{animation-name:g2;animation-duration:37s;animation-delay:-13s}
.b3{animation-name:g3;animation-duration:43s;animation-delay:-21s}
.b4{animation-name:g4;animation-duration:47s;animation-delay:-5s}
@keyframes g1{0%,100%{transform:translate(0,0)}50%{transform:translate(260px,10px) scale(1.15)}}
@keyframes g2{0%,100%{transform:translate(0,0)}50%{transform:translate(-300px,-10px) scale(1.1)}}
@keyframes g3{0%,100%{transform:translate(0,0)}50%{transform:translate(-220px,20px) scale(1.2)}}
@keyframes g4{0%,100%{transform:translate(0,0)}50%{transform:translate(280px,-16px) scale(1.15)}}
.arc{transform-box:fill-box;transform-origin:center;animation:arc 6s linear infinite}
@keyframes arc{to{transform:rotate(360deg)}}
.td{opacity:.4;animation:td 1.8s ease-in-out infinite}
@keyframes td{0%,55%,100%{opacity:.4;transform:translateY(0)}22%{opacity:1;transform:translateY(-3.5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
