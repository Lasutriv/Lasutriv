<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-labelledby="t d">
<title id="t">03 Intel Report</title>
<desc id="d">GitHub activity</desc>
<defs><clipPath id="panel"><rect width="1200" height="88" rx="20"/></clipPath>
<radialGradient id="gV"><stop offset="0" stop-color="#7c5cff" stop-opacity="0.5"/><stop offset=".4" stop-color="#7c5cff" stop-opacity="0.25"/><stop offset=".72" stop-color="#7c5cff" stop-opacity="0.07"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
