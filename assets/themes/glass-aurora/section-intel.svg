<text x="90.5" y="62" font-family="'gf-inter-400-normal', system-ui, sans-serif" font-size="13.5" fill="#a7b0c8" letter-spacing=".1">GitHub activity</text>
<rect x="1088" y="28" width="76" height="32" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".16"/><circle class="td" style="animation-delay:0s" cx="1108" cy="44" r="4.2" fill="#7c5cff"/><circle class="td" style="animation-delay:0.22s" cx="1126" cy="44" r="4.2" fill="#22d3ee"/><circle class="td" style="animation-delay:0.44s" cx="1144" cy="44" r="4.2" fill="#ff5ea8"/>
