<radialGradient id="gP"><stop offset="0" stop-color="#ff5ea8" stop-opacity="0.41"/><stop offset=".4" stop-color="#ff5ea8" stop-opacity="0.2"/><stop offset=".72" stop-color="#ff5ea8" stop-opacity="0.06"/><stop offset="1" stop-color="#ff5ea8" stop-opacity="0"/></radialGradient>
<radialGradient id="gA"><stop offset="0" stop-color="#ffb86b" stop-opacity="0.35"/><stop offset=".4" stop-color="#ffb86b" stop-opacity="0.17"/><stop offset=".72" stop-color="#ffb86b" stop-opacity="0.05"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/></radialGradient>
