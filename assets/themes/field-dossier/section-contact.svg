  <rect class="bar" style="animation-duration:1.2s;animation-delay:-0.65s" x="1040" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:1.3s;animation-delay:-0.78s" x="1054" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:1.4s;animation-delay:-0.91s" x="1068" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:1.5s;animation-delay:-1.04s" x="1082" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:0.7s;animation-delay:-1.17s" x="1096" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:0.8s;animation-delay:-1.3s" x="1110" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:0.9s;animation-delay:-1.43s" x="1124" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:1s;animation-delay:-1.56s" x="1138" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <rect class="bar" style="animation-duration:1.1s;animation-delay:-1.69s" x="1152" y="20" width="8" height="44" rx="1" fill="#f5a524"/>
  <circle cx="918" cy="42" r="4" fill="#f5a524"/>
