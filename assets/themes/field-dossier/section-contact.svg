<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-labelledby="t">
  <title id="t">05 Establish Contact</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a524" stop-opacity=".045"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#020304"/>
      <rect width="2" height="6" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
    <clipPath id="panel"><rect width="1200" height="88" rx="10"/></clipPath>
    <filter id="phosphor" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; white-space: pre; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .band { animation: band 7s linear infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes band { from { transform: translateY(-140px); }
                      to { transform: translateY(420px); } }
    .bar { transform-box: fill-box; transform-origin: bottom;
           animation: bar 1s ease-in-out infinite alternate; }
    @keyframes bar { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    .wave { transform-box: fill-box; transform-origin: center; opacity: 0;
            animation: wave 2s ease-out infinite; }
    @keyframes wave { 0% { opacity: .9; transform: scale(.6); }
                      100% { opacity: 0; transform: scale(4.2); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#panel)">
  <rect width="1200" height="88" fill="url(#bg)"/>
  <rect width="1200" height="88" fill="url(#grid)"/>
  <rect width="6" height="88" fill="#f5a524"/>
  <text x="34" y="58" font-size="36" font-weight="800" fill="#f5a524" filter="url(#phosphor)" textLength="47.2" lengthAdjust="spacing">05</text>
  <path d="M106 18V70" stroke="#30363d"/>
