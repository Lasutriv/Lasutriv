  <rect x="1014" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1026" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1036" y="22" width="4" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1046" y="22" width="6" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1058" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1068" y="22" width="8" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1082" y="22" width="4" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1092" y="22" width="6" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1106" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1114" y="22" width="8" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1130" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1142" y="22" width="2" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <rect x="1152" y="22" width="4" height="36" fill="#e6edf3" fill-opacity=".72"/>
  <text x="920" y="74" font-size="12" letter-spacing="2" fill="#6e7681" textLength="202.4" lengthAdjust="spacing">INVENTORY  //  CHECKED</text>
  <g class="laser"><rect x="916" y="16" width="10" height="48" fill="#f85149" fill-opacity=".18"/><rect x="920" y="16" width="2" height="48" fill="#f85149"/></g>
  <rect width="1200" height="88" fill="url(#scan)"/>
  <path d="M8 18V8H18M1182 8H1192V18M1192 70V80H1182M18 80H8V70" fill="none" stroke="#f5a524" stroke-opacity=".45" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="87" rx="9.5" fill="none" stroke="#30363d"/>
</svg>
