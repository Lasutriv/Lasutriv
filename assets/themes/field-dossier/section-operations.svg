<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-labelledby="t">
  <title id="t">01 Active Operations</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e6edf3" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f5a524" stop-opacity=".045"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#020304"/>
      <rect width="2" height="6" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
    <clipPath id="panel"><rect width="1200" height="88" rx="10"/></clipPath>
    <filter id="phosphor" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; white-space: pre; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .band { animation: band 7s linear infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes band { from { transform: translateY(-140px); }
                      to { transform: translateY(420px); } }
    .led { fill-opacity: .2; animation: led 2.8s ease-out infinite; }
    @keyframes led { 0% { fill-opacity: 1; } 35%, 100% { fill-opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#panel)">
  <rect width="1200" height="88" fill="url(#bg)"/>
  <rect width="1200" height="88" fill="url(#grid)"/>
  <rect width="6" height="88" fill="#f5a524"/>
  <text x="34" y="58" font-size="36" font-weight="800" fill="#f5a524" filter="url(#phosphor)" textLength="47.2" lengthAdjust="spacing">01</text>
  <path d="M106 18V70" stroke="#30363d"/>
  <text x="128" y="47" font-size="26" font-weight="800" letter-spacing="5" fill="#e6edf3" textLength="350.2" lengthAdjust="spacing">ACTIVE OPERATIONS</text>
  <text x="129" y="71" font-size="14" letter-spacing="3" fill="#8b949e" textLength="478.8" lengthAdjust="spacing">CASE FILES  //  SUMMIT TEC GAMES AND TOOLS</text>
  <rect class="led" style="animation-delay:0s" x="970" y="26" width="30" height="12" rx="2" fill="#f5a524"/>
  <text x="985.0" y="59" font-size="12" fill="#6e7681" text-anchor="middle">01</text>
  <rect class="led" style="animation-delay:0.28s" x="1010" y="26" width="30" height="12" rx="2" fill="#f5a524"/>
  <text x="1025.0" y="59" font-size="12" fill="#6e7681" text-anchor="middle">02</text>
  <rect class="led" style="animation-delay:0.56s" x="1050" y="26" width="30" height="12" rx="2" fill="#f5a524"/>
  <text x="1065.0" y="59" font-size="12" fill="#6e7681" text-anchor="middle">03</text>
  <rect class="led" style="animation-delay:0.84s" x="1090" y="26" width="30" height="12" rx="2" fill="#f5a524"/>
  <text x="1105.0" y="59" font-size="12" fill="#6e7681" text-anchor="middle">04</text>
  <rect class="led" style="animation-delay:1.12s" x="1130" y="26" width="30" height="12" rx="2" fill="#f5a524"/>
  <text x="1145.0" y="59" font-size="12" fill="#6e7681" text-anchor="middle">05</text>
  <text x="954" y="37" font-size="14" letter-spacing="3" fill="#8b949e" text-anchor="end" textLength="57" lengthAdjust="spacing">FILES</text>
  <rect width="1200" height="88" fill="url(#scan)"/>
  <path d="M8 18V8H18M1182 8H1192V18M1192 70V80H1182M18 80H8V70" fill="none" stroke="#f5a524" stroke-opacity=".45" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="87" rx="9.5" fill="none" stroke="#30363d"/>
</svg>
