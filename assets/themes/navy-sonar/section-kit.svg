  <rect x="1014" y="22" width="2" height="36" fill="#f5f0e1" fill-opacity=".72"/>
  <rect x="1026" y="22" width="2" height="36" fill="#f5f0e1" fill-opacity=".72"/>
  <rect x="1036" y="22" width="4" height="36" fill="#f5f0e1" fill-opacity=".72"/>
