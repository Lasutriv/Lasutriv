<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-labelledby="t">
  <title id="t">05 Establish Contact</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f5f0e1" stroke-opacity="0.03"/>
    </pattern>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a84a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c9a84a" stop-opacity=".045"/>
      <stop offset="1" stop-color="#c9a84a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#111a2e"/>
      <rect width="2" height="6" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect width="1200" height="88" rx="2"/></clipPath>
  </defs>
  <style>
    @font-face { font-family: 'IBM Plex Mono'; src: url(data:font/woff2;base64,) format('woff2'); }
    @font-face { font-family: 'IBM Plex Serif'; src: url(data:font/woff2;base64,) format('woff2'); }
    text { font-family: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
    .disp { font-family: 'IBM Plex Serif', 'Iowan Old Style', Georgia, serif; }
    .num { font-family: 'IBM Plex Serif', 'Iowan Old Style', Georgia, serif; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .band { animation: band 7s linear infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes band { from { transform: translateY(-140px); }
                      to { transform: translateY(108px); } }
    .bar { transform-box: fill-box; transform-origin: bottom;
           animation: bar 1s ease-in-out infinite alternate; }
    @keyframes bar { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    .wave { transform-box: fill-box; transform-origin: center; opacity: 0;
            animation: wave 2s ease-out infinite; }
    @keyframes wave { 0% { opacity: .9; transform: scale(.6); }
                      100% { opacity: 0; transform: scale(4.2); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#panel)">
  <rect width="1200" height="88" fill="url(#bg)"/>
  <rect width="1200" height="88" fill="url(#grid)"/>
